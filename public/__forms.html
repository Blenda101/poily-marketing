<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify form registration</title>
  </head>
  <body>
    <!--
      Static form so Netlify detects "waitlist" at build time.
      The real UI lives in src/components/WaitlistForm.tsx, which POSTs here.
    -->
    <form name="waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="waitlist" />
      <input type="text" name="bot-field" />
      <input type="text" name="first_name" />
      <input type="email" name="email" />
      <input type="text" name="saas_url" />
      <input type="text" name="role" />
      <input type="text" name="source" />
    </form>

    <!-- Optional progressive-profiling step (success screen), matched by email. -->
    <form name="waitlist-profile" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="waitlist-profile" />
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <input type="text" name="team_size" />
      <input type="text" name="challenge" />
    </form>
  </body>
</html>
